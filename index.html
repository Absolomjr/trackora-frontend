<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#166534" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Trackora" />

    <!-- Primary meta -->
    <title>Trackora — Inventory software built for hardware stores</title>
    <meta
      name="description"
      content="Trackora tracks your stock, sales and staff in one place, so you always know what you have, what's selling, and what's running out — from the counter or your phone."
    />
    <link rel="canonical" href="https://trackora.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Trackora" />
    <meta property="og:title" content="Trackora — Inventory software for hardware stores" />
    <meta
      property="og:description"
      content="Know exactly what's in your store without counting it again. Stock, sales and staff in one simple system."
    />
    <meta property="og:url" content="https://trackora.app/" />
    <meta property="og:image" content="https://trackora.app/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trackora — Inventory software for hardware stores" />
    <meta
      name="twitter:description"
      content="Know exactly what's in your store without counting it again."
    />
    <meta name="twitter:image" content="https://trackora.app/og-image.png" />

    <!-- Fonts: Inter (UI/body) + Space Grotesk (display headings) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
